services:
  - type: web
    name: grogoni
    runtime: node
    branch: main
    autoDeployTrigger: commit
    plan: starter
    region: oregon
    # Build order is deliberately compile-and-verify-first: the new application code must prove
    # it builds and passes every static gate (including check:retired-runtime-references) BEFORE
    # any migration touches the shared production database. db:migrate can include destructive,
    # already-applied-in-production steps (see infra/db/migrations/065_retire_execution_fabric.sql
    # and docs/architecture/native-runtime-deployment.md); running it only after build:production
    # succeeds means a failed build can never leave the schema migrated out from under whatever
    # instance is still serving traffic on the previous deploy.
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm build:production && COREPACK_HOME=/tmp/corepack corepack pnpm db:migrate && REQUIRE_NEON_DATABASE=true COREPACK_HOME=/tmp/corepack corepack pnpm db:verify-schema
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm --filter @grogoni/api start
    healthCheckPath: /health/ready
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - infra/db/**
        - packages/**
        - apps/web/**
        - services/api/**
        - scripts/**
        - vendor/**
    domains:
      - grogoni.com
      # Temporary compatibility alias for installed PWAs and cached bundles compiled before the
      # same-origin migration. Keep it until access logs show no meaningful legacy API traffic.
      - api.grogoni.com
      # Store subdomain resolution (docs/architecture/grogoni-id-slug-system.md §4): this service's
      # onRequest hook (services/api/src/app.ts) already resolves {handle}.grogoni.com and
      # 302-redirects to the real storefront, excluding api./www. and the bare apex.
      # This line registers the wildcard domain in Render; it stays unverified/inert until a
      # matching wildcard DNS record (e.g. a CNAME for *.grogoni.com) is added at whatever
      # registrar manages grogoni's DNS, pointed at this service per Render's custom-domain
      # instructions - that DNS-side step is outside this repository.
      - "*.grogoni.com"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: VITE_API_BASE_URL
        value: https://grogoni.com
      - key: VITE_DEPLOYMENT_ENV
        value: production
      - key: VITE_INFERENCE_OWNER_NODE_ENABLED
        value: "true"
      - key: VITE_INFERENCE_MAX_FALLBACKS
        value: "3"
      - key: API_HOST
        value: 0.0.0.0
      - key: WEB_ORIGINS
        value: https://grogoni.com,https://www.grogoni.com
      - key: APP_URL
        value: https://grogoni.com
      - key: AUTH_ALLOWED_REDIRECT_ORIGINS
        value: https://grogoni.com,https://www.grogoni.com
      - key: WEBAUTHN_RP_ID
        value: grogoni
      - key: WEBAUTHN_EXPECTED_ORIGINS
        value: https://grogoni.com,https://www.grogoni.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: AUTH_PASSKEYS_ENABLED
        value: "true"
      - key: AUTH_PASSWORD_FALLBACK_ENABLED
        value: "true"
      - key: SESSION_ACCESS_TTL_SECONDS
        value: "900"
      - key: SESSION_INACTIVITY_TTL_DAYS
        value: "30"
      - key: SESSION_ABSOLUTE_TTL_DAYS
        value: "180"
      - key: SESSION_ROTATION_ENABLED
        value: "true"
      - key: SESSION_REUSE_DETECTION_ENABLED
        value: "true"
      - key: OTP_HMAC_SECRET
        sync: false
      - key: PASSWORD_HASH_SECRET
        sync: false
      - key: AUTH_AUDIT_HMAC_SECRET
        sync: false
      - key: PIN_HASH_SECRET
        sync: false
      - key: AUTH_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: COMPUTER_RUNTIME_URL
        sync: false
      - key: COMPUTER_RUNTIME_SERVICE_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GROGONI_EMAIL_FROM
        value: "Grogoni <messages@grogoni.com>"
      - key: CP2_STORE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DB_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DB_QUERY_TIMEOUT_MS
        value: "15000"
      - key: DB_PERSISTENCE_QUEUE_WARN_MS
        value: "10000"
      - key: DB_SLOW_QUERY_MS
        value: "500"
      # Gates GET /metrics (docs/observability.md). Set the same value on whatever scrapes it
      # (its `x-metrics-token` header) - metrics expose pool sizing, queue depth, and per-route
      # latency, which should not be reachable by an unauthenticated request on the public internet.
      - key: METRICS_AUTH_TOKEN
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: HF_TOKEN
        sync: false
      # Vercel executes inference; Render never runs a model locally (docs/architecture/
      # inference-runtime.md). The browser never receives the inference service token, the Neon
      # object-storage credentials, or a signed artifact URL directly - Render mints those and
      # proxies the inference stream back to the client.
      # Platform default before any swap: the Shopkeeper agent on the ZeroClaw agent runtime with
      # OpenAI's GPT-6 Luna, Grogoni-funded (docs/adr/ADR-zeroclaw-default-agent-runtime.md). Needs
      # OPENAI_API_KEY below; without a ZeroClaw gateway Shopkeeper runs on Grogoni's own engine.
      - key: PLATFORM_DEFAULT_AGENT_ID
        value: builtin:shopkeeper:v1
      - key: PLATFORM_DEFAULT_AGENT_NAME
        value: Shopkeeper
      - key: PLATFORM_DEFAULT_AGENT_ADAPTER_ID
        value: zeroclaw
      - key: PLATFORM_DEFAULT_MODEL_ID
        value: gpt-6-luna
      - key: PLATFORM_DEFAULT_EXECUTION_TARGET
        value: backend
      # ZeroClaw gateway (grogoni-zeroclaw below), reached over Render's private network.
      - key: ZEROCLAW_GATEWAY_URL
        fromService:
          name: grogoni-zeroclaw
          type: pserv
          property: hostport
      - key: ZEROCLAW_ALLOW_PRIVATE_NETWORK
        value: "true"
      - key: ZEROCLAW_WEBHOOK_SECRET
        fromService:
          name: grogoni-zeroclaw
          type: pserv
          envVarKey: ZEROCLAW_gateway__webhook_secret
      - key: ZEROCLAW_TIMEOUT_MS
        value: "120000"
      - key: VERCEL_INFERENCE_URL
        sync: false
      - key: VERCEL_INFERENCE_TIMEOUT_MS
        value: "300000"
      - key: INFERENCE_REQUIRED
        value: "true"
      # Shared bearer secret between this service and services/ai-runtime's Vercel deployment.
      # Preserve the existing value during the service migration and configure that exact value
      # in both Render and Vercel; Blueprint sync cannot link secrets across providers.
      - key: GROGONI_INFERENCE_SERVICE_TOKEN
        sync: false
      - key: NEON_MODEL_STORAGE_ENDPOINT
        sync: false
      - key: NEON_MODEL_STORAGE_REGION
        value: us-east-1
      - key: NEON_MODEL_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: NEON_MODEL_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: MODEL_ARTIFACT_URL_TTL_SECONDS
        value: "900"
      # Multi-provider inference router (docs/architecture/multi-provider-inference-implementation.md).
      # All optional: blank keys leave a provider BYOK-only; nothing here is needed to boot.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: ZAI_API_KEY
        sync: false
      - key: ZAI_BASE_URL
        value: https://api.z.ai/api/paas/v4
      - key: GROGONI_LLAMA_BASE_URL
        sync: false
      - key: GROGONI_LLAMA_API_KEY
        sync: false
      - key: INFERENCE_DEFAULT_MODEL
        value: gpt-6-luna
      - key: INFERENCE_REQUEST_TIMEOUT_MS
        value: "60000"
      - key: INFERENCE_MAX_OUTPUT_TOKENS
        value: "1024"
      - key: INFERENCE_CREDENTIAL_KEYS
        sync: false
      - key: INFERENCE_OWNER_NODE_ENABLED
        value: "true"
      - key: INFERENCE_MAX_FALLBACKS
        value: "3"
      - key: INFERENCE_JOB_TIMEOUT_MS
        value: "120000"
      - key: INFERENCE_JOB_SIGNING_SECRET
        generateValue: true
      # Resource isolation (docs/architecture/resource-isolation.md): bounds concurrent inference
      # calls to ai-runtime and opens the circuit fast under sustained failure instead of letting
      # every conversation turn queue/time out against a dependency that is clearly down.
      - key: INFERENCE_MAX_CONCURRENCY
        value: "4"
      - key: INFERENCE_QUEUE_MAX
        value: "8"
      - key: INFERENCE_CIRCUIT_BREAKER_FAILURE_THRESHOLD
        value: "5"
      - key: INFERENCE_CIRCUIT_BREAKER_RESET_TIMEOUT_MS
        value: "30000"
      - key: DB_ARTIFACT_POOL_MAX
        value: "2"
      - key: DB_HEALTH_PARITY_CHECK_INTERVAL_MS
        value: "60000"
      - key: OCR_WORKER_URL
        fromService:
          name: grogoni-ocr-worker
          type: pserv
          property: hostport
      - key: OCR_CONCURRENCY
        value: "1"
      - key: OCR_JOB_TIMEOUT_SECONDS
        value: "120"
      - key: OCR_QUEUE_MAX
        value: "10"
      - key: OCR_RETRY_INITIAL_DELAY_MS
        value: "200"
      - key: OCR_RETRY_MAX_DELAY_MS
        value: "5000"
      - key: OCR_CIRCUIT_BREAKER_FAILURE_THRESHOLD
        value: "5"
      - key: OCR_CIRCUIT_BREAKER_RESET_TIMEOUT_MS
        value: "30000"
      - key: MALWARE_SCANNER_ENABLED
        value: "false"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:operations@grogoni.com
      # Signing secret for the workspace-level Render deploy webhook (Dashboard -> Integrations ->
      # Webhooks -> this webhook's Settings page). Set manually after creating that webhook; see
      # docs/deployment/render-deploy-push-notifications.md for the full setup. Until this is set,
      # POST /internal/render/deploy-webhook is never registered (services/api/src/app.ts).
      - key: RENDER_DEPLOY_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          name: grogoni-rate-limit-cache
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: grogoni-rate-limit-cache
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # Self-hosted PaddleOCR/Tesseract worker (docs/receipt-ocr.md, services/receipt-ocr-service/).
  # Private, not public: only grogoni reaches it, over Render's private network at the
  # "hostport" wired into OCR_WORKER_URL above. This is unrelated to the LLM inference boundary
  # docs/deployment/render-inference.md describes - Render still never runs a chat model itself,
  # it hosts an OCR worker, which is a bounded image/PDF-to-text tool, not a model runtime.
  - type: pserv
    name: grogoni-ocr-worker
    runtime: docker
    branch: main
    autoDeployTrigger: commit
    # starter matches every other service in this Blueprint; PaddleOCR's CPU inference is memory-
    # hungry enough that this may need sizing up if the worker OOMs under real receipt/product-photo
    # traffic - watch its Render metrics after the first real deploy. No persistent disk is mounted,
    # so PaddleOCR re-downloads its model weights on every deploy/restart (a one-time, few-second hit
    # per cold start, not per request); add a `disk` here (mirroring the retired inference service's
    # pattern) if that cold-start cost becomes worth trading for the extra disk cost.
    plan: starter
    region: oregon
    dockerfilePath: ./services/receipt-ocr-service/Dockerfile
    dockerContext: ./services/receipt-ocr-service
    buildFilter:
      paths:
        - render.yaml
        - services/receipt-ocr-service/**
    envVars:
      - key: OCR_WORKER_PORT
        value: "8090"
      - key: OCR_ENGINE_PRIMARY
        value: paddleocr
      - key: OCR_ENGINE_FALLBACK
        value: tesseract
      - key: OCR_FALLBACK_ENABLED
        value: "true"
      - key: OCR_PROFILE
        value: balanced
      - key: OCR_LANGUAGE_HINTS
        value: en,sw
      - key: OCR_MAX_UPLOAD_MB
        value: "10"
      - key: OCR_MAX_IMAGE_EDGE
        value: "3000"
      - key: OCR_MAX_PDF_PAGES
        value: "5"
      - key: OCR_CONCURRENCY
        value: "1"

  # ZeroClaw agent runtime (https://github.com/zeroclaw-labs/zeroclaw, MIT OR Apache-2.0) - the
  # default engine for the Shopkeeper agent (docs/adr/ADR-zeroclaw-default-agent-runtime.md).
  # Private: only grogoni reaches its gateway. It runs no model itself; it calls OpenAI's
  # GPT-6 Luna with Grogoni's key. Locked down: read-only risk profile with every ZeroClaw tool
  # denied, so it can only produce text, which Grogoni then parses and approval-gates like any model
  # output. No pairing tokens; the generated webhook secret is shared with grogoni above.
  - type: pserv
    name: grogoni-zeroclaw
    runtime: image
    image:
      url: ghcr.io/zeroclaw-labs/zeroclaw:v0.8.5
    plan: starter
    region: oregon
    envVars:
      - key: ZEROCLAW_gateway__host
        value: 0.0.0.0
      - key: ZEROCLAW_gateway__allow_public_bind
        value: "true"
      - key: ZEROCLAW_gateway__port
        value: "42617"
      - key: ZEROCLAW_gateway__require_pairing
        value: "false"
      - key: ZEROCLAW_gateway__webhook_secret
        generateValue: true
      - key: ZEROCLAW_gateway__session_persistence
        value: "false"
      - key: ZEROCLAW_gateway__request_timeout_secs
        value: "120"
      - key: ZEROCLAW_providers__models__openai__default__model
        value: gpt-6-luna
      - key: ZEROCLAW_providers__models__openai__default__api_key
        sync: false
      - key: ZEROCLAW_risk_profiles__default__level
        value: readonly
      - key: ZEROCLAW_risk_profiles__default__deny_all_tools
        value: "true"
      - key: ZEROCLAW_risk_profiles__default__workspace_only
        value: "true"

  - type: web
    name: grogoni-web-staging
    runtime: static
    branch: agent/passkey-auth
    autoDeployTrigger: commit
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @grogoni/web... build
    staticPublishPath: apps/web/dist
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - apps/web/**
        - packages/**
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; child-src 'self'; connect-src 'self' https://*.grogoni.com wss://*.grogoni.com; upgrade-insecure-requests"
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_DEPLOYMENT_ENV
        value: staging
      - key: VITE_INFERENCE_OWNER_NODE_ENABLED
        value: "true"
      - key: VITE_INFERENCE_MAX_FALLBACKS
        value: "3"

  - type: pserv
    name: grogoni-computer-runtime
    runtime: docker
    branch: main
    plan: starter
    region: oregon
    dockerfilePath: ./services/computer-runtime/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - packages/shared-types/**
        - services/computer-runtime/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8790"
      - key: COMPUTER_RUNTIME_SERVICE_TOKEN
        sync: false

  - type: cron
    name: grogoni-db-backup
    runtime: node
    branch: main
    schedule: "17 2 * * *"
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm db:backup
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - services/api/scripts/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: BACKUP_RETENTION_DAYS
        value: "14"
      - key: BACKUP_UPLOAD_COMMAND
        sync: false

  - type: cron
    name: grogoni-shop-purge
    runtime: node
    branch: main
    schedule: "37 3 * * *"
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @grogoni/api... build
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm db:purge-shops
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - infra/db/**
        - packages/**
        - services/api/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false

  - type: cron
    name: grogoni-account-purge
    runtime: node
    branch: main
    schedule: "7 4 * * *"
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile && COREPACK_HOME=/tmp/corepack corepack pnpm --filter @grogoni/api... build
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm db:purge-accounts
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - infra/db/**
        - packages/**
        - services/api/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: ACCOUNT_DELETION_PROCESSORS_JSON
        sync: false
      - key: ACCOUNT_DELETION_WEBHOOK_SECRET
        sync: false

  - type: cron
    name: grogoni-db-health
    runtime: node
    branch: main
    schedule: "*/10 * * * *"
    buildCommand: COREPACK_HOME=/tmp/corepack corepack pnpm install --frozen-lockfile
    startCommand: COREPACK_HOME=/tmp/corepack corepack pnpm db:health
    buildFilter:
      paths:
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
        - services/api/scripts/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "2"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DB_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DB_QUERY_TIMEOUT_MS
        value: "15000"
