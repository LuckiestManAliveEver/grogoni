services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grogoni_market
      POSTGRES_PASSWORD: grogoni_dev_password
      POSTGRES_USER: grogoni
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grogoni -d grogoni_market"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - grogoni-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - grogoni-redis-data:/data

  computer-runtime:
    profiles: ["computer"]
    build:
      context: .
      dockerfile: services/computer-runtime/Dockerfile
    environment:
      COMPUTER_RUNTIME_SERVICE_TOKEN: ${COMPUTER_RUNTIME_SERVICE_TOKEN:-grogoni-computer-local-development}
      PORT: 8790
    init: true
    ipc: private
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8790:8790"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  # Inference runs through local Ollama (OLLAMA_BASE_URL); no inference or OCR container is part
  # of this compose file (docs/local-first-cloud-audit.md).

volumes:
  grogoni-postgres-data:
  grogoni-redis-data:
