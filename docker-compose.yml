services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grogoni_market
      POSTGRES_PASSWORD: grogoni_dev_password
      POSTGRES_USER: grogoni
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grogoni -d grogoni_market"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - grogoni-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - grogoni-redis-data:/data

  computer-runtime:
    profiles: ["computer"]
    build:
      context: .
      dockerfile: services/computer-runtime/Dockerfile
    environment:
      COMPUTER_RUNTIME_SERVICE_TOKEN: ${COMPUTER_RUNTIME_SERVICE_TOKEN:-grogoni-computer-local-development}
      PORT: 8790
    init: true
    ipc: private
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8790:8790"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  # Inference now runs as a Vercel serverless function (services/ai-runtime), not a container in
  # this compose file. Run it locally with `pnpm --filter @grogoni/ai-runtime dev` (Vercel CLI dev
  # server). The API now uses local Ollama instead of this retired hosted runtime - see
  # docs/deployment/vercel-inference.md.

  receipt-ocr-worker:
    profiles: ["ocr"]
    build:
      context: ./services/receipt-ocr-service
    environment:
      OCR_ENGINE_PRIMARY: ${OCR_ENGINE_PRIMARY:-paddleocr}
      OCR_ENGINE_FALLBACK: ${OCR_ENGINE_FALLBACK:-tesseract}
      OCR_FALLBACK_ENABLED: ${OCR_FALLBACK_ENABLED:-true}
      OCR_PROFILE: ${OCR_PROFILE:-balanced}
      OCR_LANGUAGE_HINTS: ${OCR_LANGUAGE_HINTS:-en,sw}
      OCR_MAX_UPLOAD_MB: ${OCR_MAX_UPLOAD_MB:-10}
      OCR_MAX_IMAGE_EDGE: ${OCR_MAX_IMAGE_EDGE:-3000}
      OCR_MAX_PDF_PAGES: ${OCR_MAX_PDF_PAGES:-5}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-1}
      OCR_WORKER_PORT: 8090
    ports:
      - "8090:8090"

volumes:
  grogoni-postgres-data:
  grogoni-redis-data:
