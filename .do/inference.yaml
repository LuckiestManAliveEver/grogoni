# Import into App Platform after pushing the migration commit. Fill the two empty environment
# values in the DigitalOcean dashboard before deploying; never commit the service token.
name: grogoni-inference
region: nyc
services:
  - name: inference
    github:
      repo: LuckiestManAliveEver/grogoni
      branch: main
      deploy_on_push: false
    source_dir: /
    dockerfile_path: services/ai-runtime/Dockerfile
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-2gb
    http_port: 8080
    health_check:
      http_path: /ready
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: GROGONI_INFERENCE_SERVICE_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: MODEL_ARTIFACT_ALLOWED_HOSTS
        scope: RUN_TIME
        value: ""
      - key: INFERENCE_PROVIDER
        scope: RUN_TIME
        value: "huggingface"
      - key: HF_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: HF_MODEL_ID
        scope: RUN_TIME
        value: ""
      - key: HF_MODEL_MAP
        scope: RUN_TIME
        value: '{"smollm2-360m":"HuggingFaceTB/SmolLM2-1.7B-Instruct","gpt-oss-20b":"openai/gpt-oss-20b"}'
      - key: HF_INFERENCE_BASE_URL
        scope: RUN_TIME
        value: "https://router.huggingface.co/v1/"
      - key: VERCEL_MAX_ARTIFACT_BYTES
        scope: RUN_TIME
        value: "450000000"
      - key: INFERENCE_MAX_INPUT_CHARACTERS
        scope: RUN_TIME
        value: "64000"
      - key: INFERENCE_MAX_OUTPUT_TOKENS
        scope: RUN_TIME
        value: "512"
      - key: INFERENCE_RUNTIME_CACHE_ENTRIES
        scope: RUN_TIME
        value: "1"
ingress:
  rules:
    - component:
        name: inference
      match:
        path:
          prefix: /
