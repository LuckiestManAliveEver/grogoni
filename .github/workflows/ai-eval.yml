name: AI eval

# Periodic eval lane (CLAUDE.md: paid, quality-measuring, threshold-gated) for the model-fallback
# path - separate from ci.yml's fast deterministic gate, which runs on every push/PR. This runs
# nightly and on manual dispatch (before a ship) only, since it makes real model calls.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  ai-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter "./packages/**" --if-present build

      - name: Run AI eval
        # Runs the platform default model on local Ollama and grades replies with local Claude
        # Code (services/api/scripts/run-ai-eval.ts). Hosted runners have neither, so the script
        # prints why and exits 0; run it on a machine (or self-hosted runner) with both installed.
        run: pnpm eval:ai

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: /tmp/grogoni-ai-eval-report.json
          if-no-files-found: ignore
