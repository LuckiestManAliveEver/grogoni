name: AI eval

# Periodic eval lane (CLAUDE.md: paid, quality-measuring, threshold-gated) for the model-fallback
# path - separate from ci.yml's fast deterministic gate, which runs on every push/PR. This runs
# nightly and on manual dispatch (before a ship) only, since it makes real model calls.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  ai-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter "./packages/**" --if-present build

      - name: Run AI eval
        env:
          VERCEL_INFERENCE_URL: ${{ vars.VERCEL_INFERENCE_URL }}
          VERCEL_INFERENCE_TIMEOUT_MS: ${{ vars.VERCEL_INFERENCE_TIMEOUT_MS }}
          GROGONI_INFERENCE_SERVICE_TOKEN: ${{ secrets.GROGONI_INFERENCE_SERVICE_TOKEN }}
          NEON_MODEL_STORAGE_ENDPOINT: ${{ vars.NEON_MODEL_STORAGE_ENDPOINT }}
          NEON_MODEL_STORAGE_REGION: ${{ vars.NEON_MODEL_STORAGE_REGION }}
          NEON_MODEL_STORAGE_ACCESS_KEY_ID: ${{ secrets.NEON_MODEL_STORAGE_ACCESS_KEY_ID }}
          NEON_MODEL_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.NEON_MODEL_STORAGE_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_FAST_MODEL: ${{ vars.OPENAI_FAST_MODEL }}
        # No Vercel inference host configured yet -> the script prints a clear skip message and
        # exits 0. This job goes from a no-op to a real gate the moment those repo
        # variables/secrets are set - no script change needed. OPENAI_API_KEY, if set, is used
        # only as the eval judge's cloud fallback when the Vercel judge call fails.
        run: pnpm eval:ai

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: /tmp/grogoni-ai-eval-report.json
          if-no-files-found: ignore
