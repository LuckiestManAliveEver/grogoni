name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL for migration and concurrency tests (corridor-fulfillment.md A18), same
      # major version as local development (docker-compose.yml postgres:16-alpine).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grogoni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grogoni_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check
        run: pnpm run ci

      - name: PostgreSQL migrations and integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grogoni_test
          CP2_POSTGRES_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grogoni_test
          INVENTORY_BENCHMARK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grogoni_inventory_benchmark
          # Throwaway database: opt in to migration 108 (see docs/local-first-cloud-audit.md).
          PGOPTIONS: -c grogoni.allow_108=yes
        run: |
          pnpm db:migrate
          pnpm exec tsx services/api/src/benchmarks/prepare-inventory-benchmark-database.ts
          pnpm test:postgres

      - name: Private Backup Restore Certification
        env:
          BACKUP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/grogoni_test
          PG_DUMP_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: node scripts/test-private-backup-restore.mjs

      - name: Responsive and accessibility certification
        run: pnpm test:ui-cert

  android:
    # Compiles the native Android app and runs its JVM unit tests. Without this job the app went
    # uncompilable (hidden WRITE_SMS constant, Java/Kotlin JVM-target mismatch) with CI green.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # The app hosts the shared web application (verifySharedWebBundle fails the build without it).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Bundle the shared web application into the app
        working-directory: .
        run: |
          pnpm -r --filter "./packages/**" --if-present build
          pnpm android:web:bundle

      - name: Unit tests, debug APK and Android API compatibility
        run: gradle --console=plain :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

  android-device:
    # Runs the default-messenger verification on an Android 11 emulator, so a regression is caught
    # before release: SMS role and permissions, an SMS injected through the emulator modem stays
    # local with business features on, then the SMS/MMS, inbox, provider, shared-UI and native auth
    # instrumentation suites. See scripts/test-default-messenger-emulator.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Bundle the shared web application into the app
        run: |
          pnpm -r --filter "./packages/**" --if-present build
          pnpm android:web:bundle

      - name: Build the debug app and its instrumentation tests
        working-directory: apps/android
        run: gradle --console=plain :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Messenger tests on an Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: GROGONI_EMULATOR_REPORT_DIR="$RUNNER_TEMP/default-messenger-reports" bash scripts/test-default-messenger-emulator.sh emulator-5554

      - name: Keep the device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: default-messenger-emulator-reports
          path: ${{ runner.temp }}/default-messenger-reports
          if-no-files-found: ignore
