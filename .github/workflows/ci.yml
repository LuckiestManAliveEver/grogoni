name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL for migration and concurrency tests (corridor-fulfillment.md A18), same
      # major version as local development (docker-compose.yml postgres:16-alpine).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grogoni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grogoni_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check
        run: pnpm run ci

      - name: PostgreSQL migrations and integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grogoni_test
          CP2_POSTGRES_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grogoni_test
        run: |
          pnpm db:migrate
          pnpm test:postgres

      - name: Responsive and accessibility certification
        run: pnpm test:ui-cert
